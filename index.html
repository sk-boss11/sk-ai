<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK AI - Advanced AI Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a12;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#12121f;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:20px;font-weight:800} .logo span{color:#7c5cff}
header button{background:#ff3b5c;border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 15px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.user{background:#7c5cff;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1e1e2e;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #2a2a3d}
.input-area{display:flex;gap:10px;padding:14px;background:#12121f}
input{flex:1;background:#1e1e2e;border:1px solid #333;color:#fff;padding:13px 16px;border-radius:25px;outline:none}
.send{background:#7c5cff;border:none;color:#fff;width:50px;height:50px;border-radius:50%;font-size:20px;cursor:pointer}
.typing{font-style:italic;opacity:.6}
</style>
</head>
<body>
<header><div class="logo">SK <span>AI</span> ✨</div><button onclick="clearChat()">🗑️ Clear</button></header>
<div id="chat"></div>
<div class="input-area">
<input id="inp" placeholder="SK AI কে কিছু জিজ্ঞেস করো..." onkeypress="if(event.key==='Enter') send()">
<button class="send" onclick="send()">➤</button>
</div>
<script>
let chatBox=document.getElementById('chat');
let inp=document.getElementById('inp');
async function loadHistory(){
  let r=await fetch('/history'); let h=await r.json();
  chatBox.innerHTML='';
  if(h.length===0) addMsg('ai','আসসালামু আলাইকুম! আমি SK AI. তুমি আমাকে যেকোনো প্রশ্ন করতে পারো 😊');
  h.forEach(m=>addMsg(m.role==='user'?'user':'ai', m.content));
}
function addMsg(cls,txt){
  let d=document.createElement('div'); d.className='msg '+cls; d.textContent=txt;
  chatBox.appendChild(d); chatBox.scrollTop=chatBox.scrollHeight; return d;
}
async function send(){
  let t=inp.value.trim(); if(!t) return;
  addMsg('user',t); inp.value='';
  let typing=addMsg('ai','SK AI লিখছে...'); typing.classList.add('typing');
  let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  let j=await r.json(); typing.remove(); addMsg('ai',j.reply);
}
async function clearChat(){ await fetch('/clear',{method:'POST'}); loadHistory(); }
loadHistory();
</script>
</body>
  </html>
